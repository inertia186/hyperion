name: Tests

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  rails:
    name: Rails tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      RAILS_ENV: test
      BUNDLE_WITHOUT: development
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/hyperion_test
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: hyperion_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d hyperion_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Install frontend dependencies
        run: npm ci
      - name: Install native gem build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential automake pkg-config libtool libffi-dev libssl-dev libgmp-dev libpq-dev
      # Reads .ruby-version and the BUNDLED WITH version in Gemfile.lock.
      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
      - name: Prepare test database
        # Tests load fixtures; application seeds depend on live Hive data.
        run: bundle exec rails db:create db:schema:load
      - name: Build assets used by controller tests
        run: |
          npm run build
          npm run build:css
          bundle exec rails vite:build
      - name: Verify missing-body regressions before and after the helper fix
        env:
          PARALLEL_WORKERS: '1'
          SKIP_JS_BUILD: '1'
          SKIP_CSS_BUILD: '1'
        run: |
          run_fallbacks() {
            bundle exec ruby -Itest -r./test/controllers/api/v1/posts_controller_test -e 'ActiveSupport::TestCase.new("scope_probe").with_hafsql(Object.new) {}' -- --name '/test_revisions_(loads_a_missing_local_body|retains_Hive_body)/'
          }
          cp test/test_helper.rb "$RUNNER_TEMP/fixed-test-helper.rb"
          git show 7ded45741efb0ccd1b21fe0a7230db74e772a010:test/test_helper.rb > test/test_helper.rb
          set +e
          run_fallbacks > "$RUNNER_TEMP/fallbacks-before.log" 2>&1
          before_status=$?
          set -e
          cp "$RUNNER_TEMP/fixed-test-helper.rb" test/test_helper.rb
          cat "$RUNNER_TEMP/fallbacks-before.log"
          test "$before_status" -eq 1
          grep -Eq '2 runs, .*0 failures, 2 errors, 0 skips' "$RUNNER_TEMP/fallbacks-before.log"
          run_fallbacks
          bundle exec rails test test/hafsql_test_helper_test.rb
      - name: Run Rails tests
        env:
          COVERAGE: '1'
          PARALLEL_WORKERS: '1'
          # Reuse the fresh bundles from the explicit asset-build step.
          SKIP_JS_BUILD: '1'
          SKIP_CSS_BUILD: '1'
        run: bundle exec rails test
      - name: Upload Rails coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rails-coverage
          path: coverage/rails/
          if-no-files-found: error
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Run system tests
        env:
          SKIP_JS_BUILD: '1'
          SKIP_CSS_BUILD: '1'
        run: bundle exec rails test:system
      - name: Upload system test screenshots
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: system-test-screenshots
          path: tmp/screenshots
          if-no-files-found: ignore

  frontend:
    name: Frontend tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Install frontend dependencies
        run: npm ci
      - name: Run frontend tests
        run: npm run test:frontend
